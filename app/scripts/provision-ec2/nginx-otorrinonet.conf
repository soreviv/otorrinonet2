# Config de nginx para OtorrinoNet — instalar en /etc/nginx/sites-available/otorrinonet.conf
# (lo hace bootstrap.sh automáticamente).
#
# Arranca solo en HTTP (puerto 80). El bloque HTTPS lo agrega certbot
# automáticamente al correr "certbot --nginx -d otorrinonet.com -d www.otorrinonet.com"
# — no lo escribas a mano aquí.

server {
    listen 80;
    listen [::]:80;
    server_name otorrinonet.com www.otorrinonet.com;

    client_max_body_size 10M;

    # Estáticos de Next.js servidos directo desde disco (sin pasar por el proxy).
    location /_next/static/ {
        alias /var/www/otorrinonet2/app/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Imágenes/archivos públicos subidos por la app (tienda, etc.).
    location /assets/ {
        root /var/www/otorrinonet2/app/public;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Todo lo demás va al proceso de Next.js administrado por PM2.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
