services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-otorrinonet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (ver .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-otorrinonet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Solo accesible desde la propia máquina (ej. túnel SSH para Prisma Studio),
      # nunca expuesto a la interfaz pública.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-otorrinonet} -d ${POSTGRES_DB:-otorrinonet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Imagen de producción (Dockerfile target "runner"). Servicio por defecto:
  #   docker compose up --build
  app:
    build:
      context: ./app
      target: runner
    restart: unless-stopped
    env_file:
      - ./app/.env
    environment:
      # Sobrescribe el valor de .env.example: dentro de la red de compose la
      # base de datos se resuelve por el nombre del servicio ("db"), no localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-otorrinonet}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (ver .env.example)}@db:5432/${POSTGRES_DB:-otorrinonet}
    ports:
      # Solo accesible desde la propia máquina: nginx en el host habla con el
      # contenedor por localhost; internet nunca ve el puerto 3000 directo.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  # Variante de desarrollo con hot reload (Dockerfile target "dev").
  # Se activa solo bajo demanda:
  #   docker compose --profile dev up app-dev
  app-dev:
    profiles: ["dev"]
    build:
      context: ./app
      target: dev
    env_file:
      - ./app/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-otorrinonet}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (ver .env.example)}@db:5432/${POSTGRES_DB:-otorrinonet}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./app:/app
      # Evita que el bind-mount oculte lo instalado/generado dentro del contenedor.
      - /app/node_modules
      - /app/.next
      - /app/src/generated
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
