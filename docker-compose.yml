services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: otorrinonet
      POSTGRES_PASSWORD: otorrinonet
      POSTGRES_DB: otorrinonet
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otorrinonet -d otorrinonet"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Imagen de producción (Dockerfile target "runner"). Servicio por defecto:
  #   docker compose up --build
  app:
    build:
      context: ./app
      target: runner
    restart: unless-stopped
    env_file:
      - ./app/.env
    environment:
      # Sobrescribe el valor de .env.example: dentro de la red de compose la
      # base de datos se resuelve por el nombre del servicio ("db"), no localhost.
      DATABASE_URL: postgresql://otorrinonet:otorrinonet@db:5432/otorrinonet
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Variante de desarrollo con hot reload (Dockerfile target "dev").
  # Se activa solo bajo demanda:
  #   docker compose --profile dev up app-dev
  app-dev:
    profiles: ["dev"]
    build:
      context: ./app
      target: dev
    env_file:
      - ./app/.env
    environment:
      DATABASE_URL: postgresql://otorrinonet:otorrinonet@db:5432/otorrinonet
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app
      # Evita que el bind-mount oculte lo instalado/generado dentro del contenedor.
      - /app/node_modules
      - /app/.next
      - /app/src/generated
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
